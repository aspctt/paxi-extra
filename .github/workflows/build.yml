# Build every Stonecutter target on each push and pull request, so a change that
# compiles against one Minecraft version but not the other is caught here rather
# than at release time.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      # Two JDKs, because Mojang ships Java 21 through 1.21.11 and Java 25 from
      # 26.1, and each target compiles against the one its players run.
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: |
            21
            25
          distribution: 'temurin'
      - name: build
        run: ./gradlew buildAll --stacktrace
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: versions/*/build/libs/
