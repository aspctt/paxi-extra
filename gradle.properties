# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

## Mod Properties
# Per-version properties live in versions/<target>/gradle.properties

mod_id=paxiextra
# Base name of the built jar, which is published as
# <archives_name>-<mod_version>+<minecraft_version>-<mod_loader>.jar
mod_archives_name=PaxiExtra
mod_name=Paxi Extra
mod_license=LGPL-3.0-only
mod_version=1.2.1
mod_group_id=com.aspctt.paxiextra
# Named in the jar file name and the declared mod version, so a build is identifiable on sight once
# there is more than one loader to tell apart.
mod_loader=neoforge
mod_authors=Lancet_, Fyoncle, aspctt
mod_description=An addon for Paxi. Put mods' built-in packs in your load order, stop unlisted packs loading themselves, and use the --user-- flag to decide where your own packs go.
