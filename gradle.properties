# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

## Mod Properties
# Per-version properties live in versions/<target>/gradle.properties

mod_id=paxiextra
# Base name of the built jar, which is published as <archives_name>-<mod_version>+<minecraft_version>.jar
mod_archives_name=PaxiExtraNeoForge
mod_name=Paxi Extra
mod_license=LGPL-3.0-only
mod_version=1.1.2
mod_group_id=com.aspctt.paxiextra
mod_authors=Lancet_, Fyoncle, aspctt
mod_description=An addon for Paxi that extends load order to built-in packs from mods, keeps unlisted packs out of the load order, creates the datapack folder and load order file at startup, and adds a --user-- marker for placing your own packs.
