# Everything specific to one target lives here. Adding a target means adding a sibling
# directory, not editing the shared build script.

# Latest versions: https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.249
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# Parchment parameter names and javadoc.
# Latest versions: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# The mods this one is built against, pulled from the Modrinth maven. Paxi is what this addon patches;
# YUNG's API supplies the JSON helper Paxi's load order file is read with.
paxi_version=1.21.1-NeoForge-5.1.3
paxi_version_range=[1.21.1-NeoForge-5.1.3,)
yungsapi_version=1.21.1-NeoForge-5.1.8
yungsapi_version_range=[1.21.1-NeoForge-5.1.8,)
